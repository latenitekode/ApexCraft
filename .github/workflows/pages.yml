name: Publish ApexCraft
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Attempt to expand the catalog from community sources'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        with:
          python-version: '3.12'
      - name: Expand catalog
        if: github.event_name == 'workflow_dispatch' && inputs.refresh
        run: |
          pip install requests beautifulsoup4
          python scripts/refresh.py
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html app.js catalog.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
