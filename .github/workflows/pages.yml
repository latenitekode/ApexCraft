name: Publish ApexCraft
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Retrieve current crafting data before publishing'
        type: boolean
        default: true
concurrency:
  group: apexcraft-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cosmetic classification
        run: |
          pip install requests beautifulsoup4
          python -m py_compile scripts/refresh.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh typed catalog
        if: github.event_name != 'workflow_dispatch' || inputs.refresh
        run: python scripts/refresh.py
      - name: Validate frontend and catalog
        run: |
          node --check app.js
          node --check catalog.js
          node -e "global.window={};require('./catalog.js');const d=window.FORGE_CATALOG,r=d.rows;if(d.schema!==2||!r.length||r.some(x=>!['Skin','Holospray','Banner Frame','Banner Pose','Finisher','Emote','Skydive Emote','Tracker','Charm','Sticker'].includes(x.cosmetic))||new Set(r.map(x=>[x.kind,x.owner,x.cosmetic,x.name.toLowerCase()].join('|'))).size!==r.length)process.exit(1);console.log(r.length+' unique skins')"
      - name: Save latest snapshot for future refreshes
        run: |
          if ! git diff --quiet -- catalog.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add catalog.js
            git commit -m 'Refresh ApexCraft cosmetic catalog'
            git push origin HEAD:main
          fi
      - name: Package static website
        run: |
          mkdir -p _site
          cp index.html app.js catalog.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: ApexCraft-static-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > pages.json 2>pages-error.txt; then
            if jq -e '.build_type == "workflow"' pages.json > /dev/null; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Pages exists but is not set to GitHub Actions."
              echo "### Hosting not configured for Actions" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if grep -q 'HTTP 404' pages-error.txt; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages has not been enabled or is not visible to the token."
              echo "### Hosting is not initialized" >> "$GITHUB_STEP_SUMMARY"
            else
              cat pages-error.txt >&2
              exit 1
            fi
          fi
          if ! grep -q '^ready=true$' "$GITHUB_OUTPUT"; then
            echo "Catalog refresh and static website build succeeded. To publish, select GitHub Actions in [Settings → Pages](https://github.com/${GITHUB_REPOSITORY}/settings/pages), then rerun this workflow. The static site is available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: _site
  deploy:
    needs: refresh
    if: needs.refresh.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
